<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schrift</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #0f1115;
        color: #e8e6e1;
        min-height: 100vh;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }

    /* --- Dashboard --- */
    .app-name { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin: 0 0 4px; }
    .app-sub { color: #9a958a; font-size: 13px; margin: 0 0 40px; }

    .clock-card {
        background: #171a21; border: 1px solid #262a33; border-radius: 16px;
        padding: 32px 20px; text-align: center; margin-bottom: 24px;
    }
    .time { font-size: 48px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .date { color: #9a958a; font-size: 15px; margin-top: 6px; text-transform: capitalize; }

    .status-row { display: flex; gap: 10px; margin-bottom: 30px; }
    .status-pill {
        flex: 1; background: #171a21; border: 1px solid #262a33; border-radius: 12px;
        padding: 12px; text-align: center; font-size: 12px; color: #9a958a;
    }
    .status-pill b { display: block; color: #e8e6e1; font-size: 15px; margin-bottom: 2px; }

    .footer-link {
        display: block; text-align: center; color: #6b7280; font-size: 13px;
        margin-top: 40px; text-decoration: none;
    }

    /* --- Update-Bereich --- */
    .hidden { display: none !important; }
    .back-link { color: #9a958a; font-size: 14px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    .card {
        background: #171a21; border: 1px solid #262a33; border-radius: 14px; padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #c9c5ba; }
    input[type=password], textarea {
        width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #33384a;
        background: #0f1115; color: #e8e6e1; font-size: 15px; font-family: inherit;
    }
    textarea { min-height: 200px; font-family: monospace; font-size: 12px; resize: vertical; }
    button {
        width: 100%; padding: 13px; margin-top: 18px; border: none; border-radius: 10px;
        background: #4f7cff; color: white; font-weight: 600; font-size: 15px;
    }
    .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 14px; }
    .msg.ok { background: #123a24; color: #7ee2a8; }
    .msg.err { background: #3a1414; color: #ff9c9c; }
    .msg.info { background: #1e2530; color: #9a958a; }
</style>
</head>
<body>

<div class="wrap">

    <!-- DASHBOARD -->
    <div id="dashboardView">
        <div class="app-name">📖 Schrift</div>
        <div class="app-sub">Bibelstudium &amp; Gemeinschaft</div>

        <div class="clock-card">
            <div class="time" id="clockTime">--:--:--</div>
            <div class="date" id="clockDate">-</div>
        </div>

        <div class="status-row">
            <div class="status-pill"><b id="versionLabel">0.1.0</b>Version</div>
            <div class="status-pill"><b>Online</b>Status</div>
        </div>

        <a href="#" class="footer-link" id="toUpdateLink">⚙️ Update-Bereich</a>
    </div>

    <!-- UPDATE-BEREICH -->
    <div id="updateView" class="hidden">
        <a href="#" class="back-link" id="backLink">← Zurück zum Dashboard</a>

        <div id="passwordCard" class="card">
            <div style="font-weight:600; margin-bottom:4px;">Anmelden</div>
            <label>Passwort</label>
            <input type="password" id="pwInput" autocomplete="off">
            <button id="pwBtn">Weiter</button>
            <div id="pwMsg"></div>
        </div>

        <div id="updateCard" class="card hidden">
            <div style="font-weight:600; margin-bottom:10px;">Neuen Code einspielen</div>

            <label>GitHub Token (wird nur auf diesem Gerät gespeichert)</label>
            <input type="password" id="tokenInput" autocomplete="off" placeholder="github_pat_...">

            <label>Kompletten neuen Code hier einfügen</label>
            <textarea id="codeInput" placeholder="Neuen HTML-Code hier einfügen..."></textarea>
            <button id="updateBtn">Update einspielen</button>
            <div id="updateMsg"></div>
        </div>
    </div>

</div>

<script>
    // ==== Konfiguration ====
    const GITHUB_OWNER = "jatschmann";
    const GITHUB_REPO = "bibelapp";
    const GITHUB_PATH = "index.html";
    const GITHUB_BRANCH = "main";
    const ADMIN_PASSWORD = "1201"; // hier kannst du dein eigenes Passwort eintragen
    // =======================

    // --- Uhrzeit / Datum ---
    function tick() {
        const now = new Date();
        document.getElementById("clockTime").textContent =
            now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        document.getElementById("clockDate").textContent =
            now.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    }
    tick();
    setInterval(tick, 1000);

    // --- Ansicht wechseln ---
    const dashboardView = document.getElementById("dashboardView");
    const updateView = document.getElementById("updateView");

    document.getElementById("toUpdateLink").onclick = (e) => {
        e.preventDefault();
        dashboardView.classList.add("hidden");
        updateView.classList.remove("hidden");
        const savedToken = localStorage.getItem("gh_token");
        if (savedToken) document.getElementById("tokenInput").value = savedToken;
    };
    document.getElementById("backLink").onclick = (e) => {
        e.preventDefault();
        updateView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
    };

    // --- Passwort ---
    document.getElementById("pwBtn").onclick = () => {
        const pw = document.getElementById("pwInput").value;
        const msg = document.getElementById("pwMsg");
        if (pw === ADMIN_PASSWORD) {
            document.getElementById("passwordCard").classList.add("hidden");
            document.getElementById("updateCard").classList.remove("hidden");
        } else {
            msg.innerHTML = '<div class="msg err">Falsches Passwort</div>';
        }
    };

    // --- UTF-8 sicheres Base64 ---
    function utf8ToBase64(str) {
        return btoa(unescape(encodeURIComponent(str)));
    }

    // --- Update über GitHub API ---
    document.getElementById("updateBtn").onclick = async () => {
        const code = document.getElementById("codeInput").value;
        const token = document.getElementById("tokenInput").value.trim();
        const msg = document.getElementById("updateMsg");

        if (!token) {
            msg.innerHTML = '<div class="msg err">Bitte GitHub Token eintragen.</div>';
            return;
        }
        if (!code.trim()) {
            msg.innerHTML = '<div class="msg err">Bitte Code einfügen.</div>';
            return;
        }

        localStorage.setItem("gh_token", token);

        msg.innerHTML = '<div class="msg info">Hole aktuelle Version...</div>';

        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
        const headers = {
            "Authorization": `token ${token}`,
            "Accept": "application/vnd.github+json"
        };

        try {
            const getRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}`, { headers });
            if (!getRes.ok) {
                const errText = await getRes.text();
                msg.innerHTML = '<div class="msg err">Fehler beim Abrufen: ' + getRes.status + ' ' + errText + '</div>';
                return;
            }
            const getData = await getRes.json();
            const sha = getData.sha;

            msg.innerHTML = '<div class="msg info">Lade neue Version hoch...</div>';

            const putRes = await fetch(apiUrl, {
                method: "PUT",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Update via App " + new Date().toISOString(),
                    content: utf8ToBase64(code),
                    sha: sha,
                    branch: GITHUB_BRANCH
                })
            });

            if (!putRes.ok) {
                const errText = await putRes.text();
                msg.innerHTML = '<div class="msg err">Fehler beim Hochladen: ' + putRes.status + ' ' + errText + '</div>';
                return;
            }

            msg.innerHTML = '<div class="msg ok">✅ Update erfolgreich! In ca. 30-60 Sekunden ist die neue Version live. Seite dann neu laden.</div>';
            document.getElementById("codeInput").value = "";
        } catch (e) {
            msg.innerHTML = '<div class="msg err">Fehler: ' + e.message + '</div>';
        }
    };
</script>

</body>
</html>
